name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compilar
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc /MT /DNDEBUG /W3 /DUNICODE /D_UNICODE /D_CRT_SECURE_NO_WARNINGS 67.cpp /Fe:67.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib psapi.lib uxtheme.lib comctl32.lib

      - name: Verificar
        shell: cmd
        run: dir 67.exe

      - uses: actions/upload-artifact@v4
        with:
          name: 67-windows-x64
          path: 67.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 67 latest
          make_latest: "true"
          files: 67.exe
